    <!--
      Set the theme class BEFORE first paint. `class="dark"` above is the default
      the document ships with; React cannot correct it until it mounts, which
      measured ~120ms of dark on every cold load for a light-mode user. Keep the
      storage key and the accepted values in sync with ThemeProvider — this is
      the one place outside it that touches either.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("sandscape-theme");
          var resolved =
            saved === "system" || (!saved && false)
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : saved === "light"
                ? "light"
                : "dark";
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(resolved);
        } catch (e) {
          /* Blocked storage: the class already on <html> stands. */
        }
      })();
    </script>

    <style>
      /* Pre-mount paint, so the first frame is not a white flash. The theme
         provider puts `light`/`dark` on <html>, and this follows it: because
         <html> carries a background of its own, the CANVAS behind the whole
         page takes that colour, not body's. Left dark-only, a light-mode page
         showed the dark canvas through as a black band wherever the document
         scrolled past body's box — and as a grey wash behind the translucent
         sidebar. The `html.light` selector outranks any later element rule, so
         the app cannot lose this race whichever order the stylesheets land in. */
      html,
      body {
        margin: 0;
        background: hsl(225 33% 2%);
        color: hsl(0 0% 98%);
      }
      html.light,
      html.light body {
        background: hsl(0 0% 100%);
        color: hsl(0 0% 3.9%);
      }
    </style>
